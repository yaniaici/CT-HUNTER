[project]
name = "ct-hunter"
version = "0.1.0"
description = "Early detection of phishing infrastructure via Certificate Transparency logs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dnspython>=2.8.0",
    "imagehash>=4.3.2",
    "networkx>=3.6.1",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.2.3",
    "pyvis>=0.3.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "requests>=2.34.2",
    "streamlit>=1.59.2",
    "tldextract>=5.3.2",
    "websockets>=17.0.1",
]

[project.scripts]
ct-hunter-hunt = "ct_hunter.scripts.hunt:main"
ct-hunter-enrich = "ct_hunter.scripts.enrich_pending:main"
ct-hunter-crosscheck = "ct_hunter.scripts.crosscheck:main"
ct-hunter-report = "ct_hunter.scripts.generate_report:main"
ct-hunter-reputation = "ct_hunter.scripts.enrich_reputation:main"
ct-hunter-whois = "ct_hunter.scripts.enrich_whois:main"
ct-hunter-triage = "ct_hunter.scripts.auto_triage:main"
ct-hunter-reevaluate = "ct_hunter.scripts.reevaluate:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
